name: Daily Knowledge Center Ingest

# Free on GitHub Actions: this runs ~2 minutes a day against the 2,000
# minutes/month allowance for private repositories.
on:
  schedule:
    # 02:30 UTC = 08:00 IST — drafts are waiting when the team starts the day.
    # Cron on GitHub can drift by several minutes under load; that is fine here.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'How many suggestions to propose'
        required: false
        default: '8'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the backend
        # Render's free tier sleeps after 15 minutes idle and takes ~50s to
        # start. Waking it first stops the real request timing out.
        run: |
          curl -s -o /dev/null -m 90 --retry 3 --retry-delay 20 \
            "${{ secrets.BACKEND_URL }}/health" || true

      - name: Check job credentials and configuration
        run: |
          response=$(curl -s -w '\n%{http_code}' -m 60 \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/jobs/health")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Job health check failed with HTTP $code"
            exit 1
          fi
          # Fail loudly rather than silently producing nothing all week.
          echo "$body" | grep -q '"summariser":true'   || { echo "::error::No summariser key set on the backend"; exit 1; }

      - name: Propose today's suggestions
        run: |
          target='${{ github.event.inputs.target }}'
          [ -z "$target" ] && target=8
          response=$(curl -s -w '\n%{http_code}' -m 540 -X POST \
            -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
            -H 'Content-Type: application/json' \
            -d "{\"target\":$target}" \
            "${{ secrets.BACKEND_URL }}/api/jobs/shorts-daily")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Ingest failed with HTTP $code"
            exit 1
          fi
          proposed=$(echo "$body" | grep -o '"proposed":[0-9]*' | head -1 | cut -d: -f2)
          echo "::notice::Proposed ${proposed:-0} suggestions — curate them at /admin/shorts"
          # Zero is not an error: everything may already be ingested, or the
          # grounding checks may have rejected every candidate. Still surface it.
          if [ "${proposed:-0}" = "0" ]; then
            echo "::warning::No suggestions proposed today — check the skipped reasons in the response above"
          fi

      - name: Weekly housekeeping
        # Sundays only. Prunes read notifications, expired call rings and
        # stale audit rows so the 500 MB Supabase allowance stays available
        # for actual content.
        if: github.event.schedule == '30 2 * * *'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            curl -s -m 120 -X POST \
              -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}" \
              "${{ secrets.BACKEND_URL }}/api/jobs/retention" || true
          else
            echo "Not Sunday — skipping retention sweep"
          fi
